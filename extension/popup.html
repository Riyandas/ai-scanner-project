<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 200px;
            padding: 15px;
            text-align: center;
            background-color: #2b2b2b;
            color: #ffffff;
            margin: 0;
        }
        h3 {
            margin-top: 0;
            font-size: 16px;
        }
        /* Styling for the toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #4CAF50;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .status-text {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h3>AI Scanner</h3>
    
    <label class="switch">
        <input type="checkbox" id="toggleSwitch">
        <span class="slider"></span>
    </label>
    
    <div class="status-text" id="statusText">Extension is ON</div>

    <script src="popup.js"></script>
</body>
</html>
